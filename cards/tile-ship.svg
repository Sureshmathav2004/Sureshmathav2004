<svg xmlns="http://www.w3.org/2000/svg" width="293.333" height="222" viewBox="0 0 293.333 222" role="img" aria-label="Ship: 3 live apps. Deployed on Render: a churn predictor, the BakaByte chat app and SmartML Prep."><title>Ship: 3 live apps. Deployed on Render: a churn predictor, the BakaByte chat app and SmartML Prep.</title><style>@font-face{font-family:'SM Mono';font-weight:700;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'SM Display';font-weight:700;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'SM Display';font-weight:500;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'SM Sans';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}.s{font-family:'SM Sans',-apple-system,'Segoe UI',sans-serif}.d{font-family:'SM Display','SM Sans',-apple-system,'Segoe UI',sans-serif}.m{font-family:'SM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-ligatures:none}
.still{display:none}
.a-up,.a-fade,.a-grow,.a-wipe,.a-pop,.a-slide,.a-reveal,.a-scan{animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
.a-up{animation-name:up;animation-duration:.8s}
.a-fade{animation-name:fade;animation-duration:.9s;animation-timing-function:ease-out}
.a-pop{animation-name:pop;animation-duration:.7s;transform-box:fill-box;transform-origin:center}
.a-grow{animation-name:grow;animation-duration:.9s;transform-box:fill-box;transform-origin:50% 100%}
.a-wipe{animation-name:wipe;animation-duration:1.1s;transform-box:fill-box;transform-origin:0 50%;animation-timing-function:cubic-bezier(.65,0,.25,1)}
.a-slide{animation-name:slide;animation-duration:.8s}
.a-reveal{animation-name:reveal;animation-duration:1.3s;transform-box:fill-box;transform-origin:50% 0;animation-timing-function:cubic-bezier(.65,0,.25,1)}
.a-scan{animation-name:scan;animation-duration:1.3s;animation-timing-function:cubic-bezier(.65,0,.25,1)}
.a-spin{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}
.a-float{animation:float 6s ease-in-out infinite;transform-box:fill-box}
.a-twinkle{animation:twinkle 3.2s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes reveal{from{transform:scaleY(0)}to{transform:none}}
@keyframes scan{0%{opacity:0;transform:translateY(0)}12%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateY(var(--scan,300px))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important;transition:none!important}
.motion{display:none}.still{display:inline}
}
</style><defs><linearGradient id="tf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5499"/><stop offset="1" stop-color="#C93172"/></linearGradient><clipPath id="tc"><rect width="281.3" height="210" rx="16"/></clipPath></defs><g transform="translate(6 6)"><g class="a-up" style="animation-delay:1.84s"><rect width="281.3" height="210" rx="16" fill="url(#tf)"/><g clip-path="url(#tc)"><g class="a-fade" style="animation-delay:2.14s;animation-duration:1.20s"><g class="a-spin" style="animation-delay:0.00s;animation-duration:48.0s"><polygon points="359.3,216.0 318.3,287.0 236.3,287.0 195.3,216.0 236.3,145.0 318.3,145.0" fill="none" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="2"/></g></g><circle cx="277.3333333333333" cy="216" r="36" fill="#FFFFFF" opacity=".08"/></g><text x="24.0" y="40.0" class="m" font-weight="700" font-size="11.5" fill="#FFDCEA" text-anchor="start" letter-spacing="2">SHIP</text><text x="257.3" y="41.0" class="m a-pop" font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="end" style="animation-delay:2.29s">↗</text><g class="a-up" style="animation-delay:1.99s"><text x="23.0" y="108.0" class="d" font-weight="700" font-size="46" fill="#FFFFFF" text-anchor="start" letter-spacing="-1">3</text><text x="63.7" y="108.0" class="d" font-weight="500" font-size="33" fill="#FFFFFF" text-anchor="start" letter-spacing="-.5">live apps</text></g><text x="24.0" y="146.0" class="s a-up" font-weight="400" font-size="14.5" fill="#FFDCEA" text-anchor="start" style="animation-delay:2.12s">Deployed on Render: a churn</text><text x="24.0" y="167.0" class="s a-up" font-weight="400" font-size="14.5" fill="#FFDCEA" text-anchor="start" style="animation-delay:2.18s">predictor, the BakaByte chat app</text><text x="24.0" y="188.0" class="s a-up" font-weight="400" font-size="14.5" fill="#FFDCEA" text-anchor="start" style="animation-delay:2.24s">and SmartML Prep.</text></g></g></svg>
