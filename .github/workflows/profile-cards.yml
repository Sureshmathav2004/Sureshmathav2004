name: Profile cards

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - fonts/**
      - assets/**
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh contribution data
        env:
          # Add a classic PAT with read:user as the PROFILE_TOKEN secret to include
          # private contributions; GITHUB_TOKEN alone counts public activity only.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh api graphql -F login="${{ github.repository_owner }}" -F query=@scripts/github.graphql > data/github.tmp.json
          python3 -c "import json,sys; d=json.load(open('data/github.tmp.json')); sys.exit('GraphQL error: %s' % d['errors'] if d.get('errors') else 0)"
          mv data/github.tmp.json data/github.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonttools (pyftsubset)
        run: pip install "fonttools>=4.47"

      - name: Render cards
        run: python scripts/render_cards.py

      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data/github.json README.md
          if git diff --cached --quiet; then
            echo "Cards unchanged."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
